# CI: build, test and validate the plugin (ADR 0004).
#
# Which jobs run:
#
#   Event                                                  linux  sound  macos  windows
#   push to main                                             yes    yes    yes    no
#   push to any other branch                                 yes    yes    no     no
#   pull_request to main, ready for review                   no     no     yes    no
#     (opened, synchronize, reopened, ready_for_review)
#   pull_request to main, draft                              no     no     no     no
#   workflow_dispatch, platforms=all                         yes    yes    yes    yes
#   workflow_dispatch, platforms=linux | macos | windows     only the chosen job (linux brings sound)
#   workflow_dispatch, platforms=content                     only "content"
#
# "sound" runs the tests of the Python sound tools (tools/sound) and of the content tools (tools/content) on the
# image's own python3.
#
# "content" packs the per-kit content zips (tools/content/pack.py, ADR 0022). It runs only when dispatched with
# platforms=content, never with "all": it pulls the kits' samples through Git LFS, which counts against the repo
# owner's LFS bandwidth (about 200 MB for the four kits' first run), and its zips (about 175 MB) take artifact
# storage for 3 days. Before any download it checks that every listed sample is in the commit. The samples it
# pulls are cached by each kit's manifest hash, but a cache belongs to its branch (any branch can also restore
# main's) and is evicted after 7 days unused: a re-run on the same branch that week downloads nothing, and a run
# on another branch downloads again unless main has the cache. So dispatch it on main when you can:
#   gh workflow run ci.yml --ref <branch> -f platforms=content
#
# Windows runs only when dispatched: for now only macOS is needed (ADR 0004).
#
# Nothing runs for:
#   - pushes and PRs that change only docs/** or **/*.md, except dist/INSTALL.md, which ships in
#     the macOS zip and is tested ("paths": the last pattern that matches a file decides). A PR is
#     filtered on its whole diff, so a docs-only commit to a PR with code changes still runs the
#     desktop jobs. If a job here ever becomes a required check, drop paths from pull_request: a
#     docs-only PR would stay "Pending" and couldn't merge (GitHub docs, "Skipping workflow runs").
#   - tag pushes ("branches" is set, so tags never match)
#   - PRs to other base branches, other PR activity (closed, labeled, ...), and PRs
#     with a merge conflict (GitHub skips pull_request runs until it is resolved)
#
# Why:
#   - Linux never runs on pull_request. The push to the PR branch already runs it.
#   - macOS costs about 10x Linux a minute, so the desktop jobs wait until a PR is
#     ready. They also run on pushes to main so that main holds the sccache entries
#     that PR runs can restore.
#   - Concurrency is per event, ref and dispatch choice: a push doesn't cancel a
#     dispatched run, and dispatching windows doesn't cancel a dispatched macos run.
#
# The "Run workflow" button appears once this file is on main. Before that, dispatch from
# the command line (it works once the workflow has run on that branch):
#   gh workflow run ci.yml --ref <branch> -f platforms=macos

name: CI

on:
  push:
    branches: ["**"]
    paths: ["**", "!docs/**", "!**/*.md", "dist/INSTALL.md"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["**", "!docs/**", "!**/*.md", "dist/INSTALL.md"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which jobs to run
        type: choice
        options: [all, linux, macos, windows, content]
        default: all
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.platforms }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCCACHE_GHA_ENABLED: "true"
  # Without this, sccache doesn't cache compiles with several -arch flags (the universal macOS build).
  SCCACHE_CACHE_MULTIARCH: "1"

defaults:
  run:
    shell: bash # Git Bash on Windows

jobs:
  linux:
    name: Linux
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'linux'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Clang, not GCC: JUCE adds -flto in Release, and lld can't link GCC's LTO objects.
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          # Pinned like the validators. Unset, the action takes sccache's latest release.
          version: v0.19.0

      - uses: actions/setup-node@v7
        with:
          # The exact version in .nvmrc, before Configure so CMake finds it: the legacy baseline (golden_check,
          # and the ctest tests golden.export_golden and golden.legacy_audit) refuses any other
          # (cmake/WubansiaGolden.cmake).
          node-version-file: .nvmrc

      - name: Install build dependencies
        # JUCE's list (docs/Linux Dependencies.md) without libwebkit2gtk-4.1-dev and
        # libcurl4-openssl-dev, which JUCE_WEB_BROWSER=0 and JUCE_USE_CURL=0 make unnecessary.
        # Ninja, xvfb and unzip are already on the image.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev libegl-dev libglu1-mesa-dev mesa-common-dev \
            lld

      - name: Configure
        run: |
          cmake --version
          "$CXX" --version
          cmake --preset release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld \
            -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld

      - name: Build
        id: build
        run: cmake --build --preset release

      - name: Golden check (legacy baseline)
        # Regenerates the 516 legacy MIDI files from frozen legacy/web-pack/core.js with the Node in
        # .nvmrc, checks them against content/golden/legacy-v21.sha256 (cmake/WubansiaGolden.cmake),
        # and asserts that they fail every gating band with exactly core/tests/legacy_expected.json's
        # values. Before Test, so the C++ metric tests that read build/golden run instead of skipping.
        run: cmake --build --preset release --target golden_check

      - name: Test
        # Also after a failed golden check, so its failure doesn't hide the other tests'.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ctest --preset release --output-on-failure # needs no display; validate.sh uses xvfb for pluginval

      - name: Window test (Xvfb)
        # The one case that needs a window the OS can give the keyboard to: opening the Samples drawer gives its list
        # the keys. ctest runs with no display, where it skips. Run on its own here, so that a skip (exit code 4: no
        # display, or a window that never got the focus) or a name that no longer matches (exit code 2) fails the step.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: xvfb-run -a build/release/plugin/WubansiaPluginTests "opening the drawer gives its list the keyboard*"

      - name: Fetch validators
        # pluginval only. The report-only step below fetches clap-validator itself, so a
        # failed clap-validator download can't turn this job red.
        timeout-minutes: 5
        env:
          WUBANSIA_CLAP_VALIDATOR: "0"
        run: bash tools/ci/fetch-validators.sh

      - name: pluginval (VST3)
        timeout-minutes: 10
        run: bash tools/ci/validate.sh build/release vst3

      - name: clap-validator (CLAP, report-only)
        # Report-only until clap-juce-extensions PR #193 lands (ADR 0004).
        timeout-minutes: 10
        continue-on-error: true
        run: bash tools/ci/validate.sh build/release clap

  sound:
    name: Sound tools
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'linux'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Python packages
        # The image's python3 (3.12), in a venv, wheels only: nothing compiles. The vocal chain
        # (requirements-vocals.txt) and its models stay out of CI; the Whisper test skips itself. The drum kit SFZ
        # test's sfzlint and pysfizz (requirements-drumkit.txt, ADR 0030) are test-time only and ship nothing.
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --only-binary :all: -r tools/sound/requirements.txt
          .venv/bin/python -m pip install --only-binary :all: -r tools/content/requirements-drumkit.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Test
        run: python3 -m unittest discover -s tools/sound/tests -t . -v

      - name: Content tools
        # pack.py and install.py on a synthetic kit, and install-macos.sh's dry runs against a fake home folder
        # (ADR 0022). Standard library only; shellcheck and unzip are on the image. pack.py --check finds every
        # sample the kit manifests list in this commit, as an LFS pointer with the manifest's SHA-256: it reads
        # the pointers only, so it downloads nothing. The drum kit SFZ test (ADR 0030) runs sfzlint and sfizz on the
        # committed texts here, where WUBANSIA_SFZ_TOOLS makes a missing module a failure; the macOS job skips it.
        env:
          WUBANSIA_SFZ_TOOLS: "1"
        run: |
          shellcheck --shell=bash dist/install-macos.sh
          python3 tools/content/pack.py --check
          python3 -m unittest discover -s tools/content/tests -t . -v

  macos:
    name: macOS
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'macos'))
    runs-on: macos-15
    timeout-minutes: 40
    env:
      ARTEFACTS: build/release/plugin/Wubansia_artefacts/Release
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0

      - name: Configure
        run: |
          xcodebuild -version
          cmake --version
          cmake --preset release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release --output-on-failure

      - name: Re-sign the bundles ad hoc
        # Required, not a precaution. JUCE signs the VST3 before it writes moduleinfo.json
        # into it, the AU only gets a bundle signature in JUCE's copy step (not run here),
        # JUCE never signs the Standalone app, and clap-juce-extensions never signs the CLAP.
        run: |
          for bundle in "$ARTEFACTS/VST3/Wubansia.vst3" "$ARTEFACTS/AU/Wubansia.component" \
                        "$ARTEFACTS/CLAP/Wubansia.clap" "$ARTEFACTS/Standalone/Wubansia.app"; do
            codesign --force --sign - "$bundle"
            codesign --verify --strict --verbose=2 "$bundle"
          done

      - name: Check the bundles are universal
        run: |
          for bundle in "$ARTEFACTS/VST3/Wubansia.vst3" "$ARTEFACTS/AU/Wubansia.component" \
                        "$ARTEFACTS/CLAP/Wubansia.clap" "$ARTEFACTS/Standalone/Wubansia.app"; do
            exe=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$bundle/Contents/Info.plist")
            archs=$(lipo -archs "$bundle/Contents/MacOS/$exe")
            echo "$bundle: $archs"
            sorted=$(echo "$archs" | tr ' ' '\n' | sort | tr '\n' ' ')
            if [ "$sorted" != "arm64 x86_64 " ]; then
              echo "::error::$bundle/Contents/MacOS/$exe has '$archs', expected arm64 and x86_64"
              exit 1
            fi
          done

      - name: Fetch validators
        timeout-minutes: 5
        run: bash tools/ci/fetch-validators.sh

      - name: pluginval (VST3, AU) and auval
        # Installs the signed AU into ~/Library/Audio/Plug-Ins/Components, waits up to 60 s
        # for it to register, then runs pluginval on it and auval -strict.
        timeout-minutes: 10
        run: bash tools/ci/validate.sh build/release mac

      - name: Package
        id: package
        env:
          # The PR head commit, which is what the PR page shows. The build itself is
          # GitHub's merge of that commit into main.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          zip="Wubansia-macOS-${HEAD_SHA:0:7}.zip"
          mkdir -p dist/Wubansia
          for bundle in "$ARTEFACTS/VST3/Wubansia.vst3" "$ARTEFACTS/AU/Wubansia.component" \
                        "$ARTEFACTS/CLAP/Wubansia.clap" "$ARTEFACTS/Standalone/Wubansia.app"; do
            ditto "$bundle" "dist/Wubansia/$(basename "$bundle")"
          done
          cp THIRD_PARTY_NOTICES.md dist/Wubansia/ # the bundled licenses require it with the binaries
          cp dist/INSTALL.md dist/install-macos.sh dist/Wubansia/ # how to install, and the installer (ADR 0022)
          ditto -c -k --keepParent dist/Wubansia "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Check the package
        # The zip, unpacked as Finder does: exactly the four bundles, the notices, INSTALL.md and an executable
        # install-macos.sh; each bundle still passes codesign --verify --strict after packaging; and the installer
        # runs on the runner's bash 3.2 (a dry run; no content zips here).
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          unpacked=$RUNNER_TEMP/package
          rm -rf "$unpacked"
          ditto -x -k "$ZIP" "$unpacked"
          for item in Wubansia.vst3 Wubansia.component Wubansia.clap Wubansia.app \
                      THIRD_PARTY_NOTICES.md INSTALL.md install-macos.sh; do
            if [ ! -e "$unpacked/Wubansia/$item" ]; then
              echo "::error::$ZIP has no Wubansia/$item"
              exit 1
            fi
          done
          count=$(find "$unpacked/Wubansia" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')
          if [ "$count" != 7 ] || [ "$(find "$unpacked" -mindepth 1 -maxdepth 1)" != "$unpacked/Wubansia" ]; then
            echo "::error::$ZIP holds more than Wubansia/ and its 7 items:"
            find "$unpacked" -maxdepth 2
            exit 1
          fi
          if [ ! -x "$unpacked/Wubansia/install-macos.sh" ]; then
            echo "::error::install-macos.sh isn't executable in $ZIP"
            exit 1
          fi
          for bundle in "$unpacked/Wubansia/Wubansia.vst3" "$unpacked/Wubansia/Wubansia.component" \
                        "$unpacked/Wubansia/Wubansia.clap" "$unpacked/Wubansia/Wubansia.app"; do
            codesign --verify --strict --verbose=2 "$bundle"
          done
          bash "$unpacked/Wubansia/install-macos.sh" --dry-run

      - name: Upload
        # archive: false uploads the zip itself (one unzip for the user, and ditto keeps
        # the file modes). The artifact takes the file's name. `name` must match it anyway,
        # because overwrite deletes the old artifact by `name` (default "artifact").
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          archive: false
          overwrite: true
          retention-days: 14
          if-no-files-found: error

      - name: Install with install-macos.sh
        # The installer as you run it, for real, after the upload (a failure here leaves the zip uploaded). The
        # unpacked bundles first get the quarantine flag a browser download gives them. It replaces the AU the
        # validation step installed. Each installed bundle must then pass codesign --verify --strict without
        # the flag.
        run: |
          unpacked=$RUNNER_TEMP/package/Wubansia
          for bundle in "$unpacked/Wubansia.vst3" "$unpacked/Wubansia.component" "$unpacked/Wubansia.clap" \
                        "$unpacked/Wubansia.app"; do
            xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;" "$bundle"
          done
          bash "$unpacked/install-macos.sh" --plugins-only
          apps=/Applications
          if [ ! -w /Applications ]; then apps=$HOME/Applications; fi
          for bundle in "$HOME/Library/Audio/Plug-Ins/VST3/Wubansia.vst3" \
                        "$HOME/Library/Audio/Plug-Ins/Components/Wubansia.component" \
                        "$HOME/Library/Audio/Plug-Ins/CLAP/Wubansia.clap" "$apps/Wubansia.app"; do
            codesign --verify --strict --verbose=2 "$bundle"
            if xattr -p com.apple.quarantine "$bundle" >/dev/null 2>&1; then
              echo "::error::$bundle still has the quarantine flag"
              exit 1
            fi
          done

      - name: Content tools
        # tools/content's tests on the runner's bash 3.2 and BSD tools: install-macos.sh's dry runs against a fake
        # home folder, and a real content install into it (ADR 0022). Standard library only.
        run: python3 -m unittest discover -s tools/content/tests -t . -v

  content:
    name: Content (${{ matrix.kit }})
    # Dispatch with platforms=content only (see the table at the top): it uses LFS bandwidth and artifact storage.
    if: github.event_name == 'workflow_dispatch' && inputs.platforms == 'content'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kit: [fut01, fut02, fut03, fut04]
    steps:
      - uses: actions/checkout@v7
        with:
          # Kept for this job's git lfs pull, which authenticates with the checkout's token. The job runs only
          # this repo's own scripts. Without lfs: true, the checkout itself fetches no samples.
          persist-credentials: true

      - name: Check the kit's samples are in this commit
        # Before any LFS download: every file the kit's manifest lists must be here as an LFS pointer whose oid is
        # the manifest's SHA-256. A missing file would otherwise show up only after the download, at Pack.
        env:
          KIT: ${{ matrix.kit }}
        run: python3 tools/content/pack.py --kit "$KIT" --check

      - name: Restore the kit's samples from the cache
        uses: actions/cache@v5
        with:
          path: .git/lfs/objects
          # The kit's manifest lists every file it packs, with its SHA-256: the same manifest, the same samples.
          # The cache is this branch's (or main's) and lasts 7 days unused. A changed manifest restores the
          # previous one's objects, so only the changed samples download.
          key: content-lfs-${{ matrix.kit }}-${{ hashFiles(format('content/plugin/{0}/*_kit.json', matrix.kit)) }}
          restore-keys: content-lfs-${{ matrix.kit }}-

      - name: Pull the listed samples (Git LFS)
        # Only the files the kit's manifest lists, not the reference loops beside them. git lfs downloads only the
        # objects the cache didn't have.
        env:
          KIT: ${{ matrix.kit }}
        run: |
          include=$(python3 tools/content/pack.py --kit "$KIT" --list | paste -sd, -)
          git lfs pull --include "$include"

      - name: Pack
        id: pack
        env:
          KIT: ${{ matrix.kit }}
        run: |
          python3 tools/content/pack.py --kit "$KIT" --out build/content
          for zip in build/content/Wubansia-Content-*.zip; do echo "zip=${zip##*/}" >> "$GITHUB_OUTPUT"; done

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.zip }}
          path: build/content/${{ steps.pack.outputs.zip }}
          archive: false
          overwrite: true
          retention-days: 3
          if-no-files-found: error

  windows:
    name: Windows
    if: github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'windows')
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      ARTEFACTS: build/release/plugin/Wubansia_artefacts/Release
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0

      - name: Configure
        # No compiler flags: the root CMakeLists.txt picks clang-cl itself. The last line
        # shows which clang-cl it picked (VS-bundled or the image's LLVM).
        run: |
          cmake --version
          clang-cl --version || true
          cmake --preset release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          grep -hE '^set\(CMAKE_(C|CXX)_COMPILER(_VERSION)? ' build/release/CMakeFiles/*/CMake*Compiler.cmake || true

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release --output-on-failure

      - name: Fetch validators
        timeout-minutes: 5
        run: bash tools/ci/fetch-validators.sh

      - name: pluginval (VST3)
        timeout-minutes: 10
        run: bash tools/ci/validate.sh build/release vst3

      - name: Package
        id: package
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          zip="Wubansia-Windows-${HEAD_SHA:0:7}.zip"
          mkdir -p dist/Wubansia
          cp -R "$ARTEFACTS/VST3/Wubansia.vst3" "$ARTEFACTS/CLAP/Wubansia.clap" \
                "$ARTEFACTS/Standalone/Wubansia.exe" THIRD_PARTY_NOTICES.md dist/Wubansia/
          (cd dist && 7z a -tzip "../$zip" Wubansia)
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          archive: false
          overwrite: true
          retention-days: 14
          if-no-files-found: error
